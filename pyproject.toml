[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simulated_annealing_abc"
version = "0.0.1"
description = "Simulation-based inference using Simulated Annealing ABC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.17",
    "scipy",
]

[project.urls]
Homepage = "https://github.com/ulzegasi/SimulatedAnnealingABC"
Source = "https://github.com/ulzegasi/SimulatedAnnealingABC"
"Bug Tracker" = "https://github.com/ulzegasi/SimulatedAnnealingABC/issues"

[project.optional-dependencies]
numba = ["numba"]
viz = ["tqdm", "rich", "matplotlib"]
test = ["pytest", "pytest-cov"]

[tool.ty.src]
include = ["src"]

[tool.ruff]
# ruff is less lenient than pylint and does not make any exceptions
# (for docstrings, strings and comments in particular).
line-length = 100
# exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "B",  # bugbear
    "D",  # pydocstyle
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
    "PL", # pylint
    "RUF", # ruff
    "S", # bandit
    "W",  # pycodestyle
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: end-to-end integration tests",
]
addopts = "-ra -q --cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
